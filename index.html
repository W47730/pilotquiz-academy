<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PilotQuiz Academy V5</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1325;color:#f0f5ff;font:16px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:760px;margin:auto;padding:20px}header{padding:18px 20px;background:#14213a;font-weight:800;color:#fff}h1{font-size:28px}button,select{font:inherit}button{cursor:pointer} .card{background:#15233b;border:1px solid #2b3e5c;border-radius:18px;padding:18px;margin:14px 0}.btn{border:1px solid #415675;background:#233958;color:white;border-radius:12px;padding:13px 15px;margin:5px 4px 5px 0}.primary{background:#1673c7;border-color:#1673c7}.danger{background:#b92643;border-color:#b92643}.hidden{display:none!important}.option{display:block;text-align:left;width:100%;padding:15px;margin:9px 0;border-radius:12px;background:#1b2d49;border:1px solid #40516d;color:#fff}.selected{border:2px solid #69b4ff}.correct{background:#164e40}.incorrect{background:#653044}.muted{color:#aabbd4;font-size:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-height:280px;overflow-y:auto}.tile{border:1px solid #465977;border-radius:8px;background:#293a55;color:white;padding:10px 0}.tile.good{background:#176748}.tile.bad{background:#9c344a}.tile.current{outline:2px solid #fff}select{width:100%;padding:12px;background:#203452;color:white;border-radius:10px;border:1px solid #49607e;margin:8px 0 14px}.pill{font-size:13px;color:#a8d8ff}.feedback{color:#9ef0c1}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.modal>.card{max-width:400px}</style></head><body><header>✈ PilotQuiz Academy <span class="pill">V5</span></header><main><section id="home"><h1>Scegli la materia</h1><button class="option" id="flight">✈️ Principi di volo · 201 domande</button><button class="option" id="english">🌐 Inglese aeronautico · 311 domande</button></section><section id="setup" class="hidden"><button class="btn" id="back">← Materie</button><h1 id="subjectName"></h1><p class="muted"><span id="total"></span> domande disponibili</p><div class="card"><label>Modalità</label><select id="mode"><option value="study">Studio (correzione immediata)</option><option value="exam">Esame (risultato alla fine)</option></select><label>Numero domande</label><select id="count"></select><label>Ordine</label><select id="order"><option value="sequential">Numerico</option><option value="random">Casuale</option></select><button class="btn primary" id="start">Inizia quiz</button><button class="btn hidden" id="resume">Riprendi sessione</button><p class="muted">Nessun timer. Progressi salvati su questo browser.</p></div></section><section id="quiz" class="hidden"><div class="row"><span id="counter" class="muted"></span><button class="btn" id="gridBtn" aria-label="Elenco domande">▦</button><button class="btn danger" id="exit">Esci</button></div><div id="navigator" class="card hidden"><b>Vai alla domanda</b><p class="muted">Verde: corretta · Rosso: errata</p><div class="grid" id="tiles"></div></div><div class="card"><div class="row"><span class="pill">PPL · QUIZ</span><button class="btn hidden" id="lang">Traduci</button></div><p id="translationStatus" class="muted"></p><h2 id="question"></h2><div id="options"></div><p id="feedback" class="feedback"></p></div><div class="row"><button class="btn" id="prev">← Precedente</button><button class="btn primary" id="next">Successiva →</button></div></section><section id="result" class="hidden"><h1>Risultato</h1><div class="card"><h2 id="score"></h2><button class="btn primary" id="again">Torna alla materia</button></div></section></main><div class="modal hidden" id="modal"><div class="card"><h2>Vuoi uscire?</h2><p>Le risposte sono salvate e potrai riprendere la sessione.</p><button class="btn" id="cancel">Annulla</button><button class="btn danger" id="confirm">Sì, esci</button></div></div><script>const FLIGHT=[{"id": 1, "q": "La forza determinata dal gioco di pressioni sull’ala viene chiamata:", "options": ["Resistenza", "Forza aerodinamica totale", "Trazione verso l’alto", "Effetto “magnum”"], "correct": "B"}, {"id": 2, "q": "Tra le cause che determinano la nascita della portanza vi è la differenza di velocità di scorrimento delle particelle d’aria sul dorso e sul ventre dell’ala. Vero o falso?", "options": ["Vero", "Falso", "", ""], "correct": "A"}, {"id": 3, "q": "La stabilità trasversale di un velivolo può essere incrementata con l’adozione di:", "options": ["alettoni differenziali", "spoilers di volo", "diedro alare", "profili alari biconvessi simmetrici"], "correct": "C"}, {"id": 4, "q": "Relativamente alla condizione di stallo, quando l’aereo stalla:", "options": ["si formano dei vortici ed i filetti d’aria si staccano dal dorso dell’ala", "si forma un flusso d’aria laminare", "il flusso d’aria aumenta la portanza", "il flusso d’aria provoca una diminuzione di resistenza"], "correct": "A"}, {"id": 5, "q": "In caso di piantata di motore in finale o in avvicinamento planato senza motore, continuare l’avvicinamento richiamando al massimo il velivolo, anche quando si avvertono i primi sintomi dello stallo, è quanto di meglio si possa fare per cercare di raggiungere la pista. Vero o falso?", "options": ["vero", "falso", "", ""], "correct": "B"}, {"id": 6, "q": "L’unità di misura fondamentale per le distanze nella navigazione aerea è:", "options": ["il piede (ft = 0,304 m) al minuto", "il Km/ora", "il miglio nautico (NM = 1852 m)", "il millibar (mb)"], "correct": "C"}, {"id": 7, "q": "Durante la discesa, la trazione:", "options": ["si annulla", "si sottrae al peso", "si aggiunge al peso apparente", "si aggiunge alla componente del peso lungo la traiettoria"], "correct": "D"}, {"id": 8, "q": "Il caratteristico scuotimento (buffeting) che precede lo stallo è provocato da:", "options": ["l’aumento della scia a valle del profilo", "le oscillazioni della estremità alari", "l’aumento dei vortici marginali", "l’instabilità del flusso dorsale, che con rapida successione si stacca e si riattacca alla superficie alare"], "correct": "D"}, {"id": 9, "q": "A parità di quota e di angolo di inclinazione laterale (bank):", "options": ["il raggio di virata aumenta con l’aumentare della velocità", "il raggio di virata diminuisce con l’aumentare della velocità", "il raggio di virata non dipende dalla velocità, ma solo dall’angolo di inclinazione laterale", "nessuna delle precedenti risposte è corretta"], "correct": "A"}, {"id": 10, "q": "La resistenza indotta è originata:", "options": ["dall’attrito dell’aria sulla superficie più o meno ruvida dell’ala", "dallo spessore più o meno rilevante del profilo", "dalla deflessione dei filetti fluidi sui piani di coda", "dalla presenza dei vortici marginali"], "correct": "D"}, {"id": 11, "q": "Come viene chiamata la componente della forza aerodinamica che sostiene il peso dell’aeromobile?", "options": ["resistenza", "trazione", "peso", "portanza"], "correct": "D"}, {"id": 12, "q": "La velocità delle particelle d’aria sul dorso di un’ala in volo è:", "options": ["minore sul dorso che sul ventre", "maggiore sul dorso che sul ventre", "la stessa da entrambe le parti", "nessuna delle risposte precedenti è corretta"], "correct": "B"}, {"id": 13, "q": "La stabilità direzionale di un velivolo è assicurata essenzialmente:", "options": ["dalla parte fissa (deriva) dell’impennaggio verticale", "dagli alettoni", "dallo stabilizzatore", "dal timone di direzione (parte mobile)"], "correct": "A"}, {"id": 14, "q": "Lo stallo di un’ala è un fenomeno la cui apparizione dipende essenzialmente da:", "options": ["un certo valore critico di IAS", "un certo valore dell’angolo d’incidenza", "un’improvvisa diminuzione di resistenza", "una particolare variazione della densità dell’aria"], "correct": "B"}, {"id": 15, "q": "Nella virata in finale eseguita troppo stretta o a quota più bassa di quella standard, quale è il pericolo maggiore che si corre?", "options": ["di atterrare fuori pista", "di arrivare troppo corti", "di arrivare troppo lunghi", "di incappare in uno stallo secondario con possibilità di vite"], "correct": "D"}, {"id": 16, "q": "La velocità orizzontale può essere espressa in:", "options": ["chilometri/ora (Km/h); nodi (kts); miglia statutarie per ora (MPH)", "Nodi (kts); gradi al minuto; chilometri/ora (Km/h)", "chilometri/ora (Km/h); miglia statutarie per ora (MPH); millibars per ora", "chilometri/ora (Km/h); nodi per ora (kts/h); miglia statutarie per ora (MPH)"], "correct": "A"}, {"id": 17, "q": "Durante la discesa, la portanza è:", "options": ["maggiore di quella corrispondente al volo orizzontale", "uguale a quella corrispondente al volo orizzontale", "minore di quella corrispondente al volo orizzontale", "uguale alla trazione"], "correct": "C"}, {"id": 18, "q": "A parità di quota e di velocità, il raggio di virata:", "options": ["aumenta aumentando l’inclinazione laterale", "aumenta diminuendo l’inclinazione laterale", "diminuisce diminuendo l’inclinazione laterale", "diminuisce di 1 m per ogni grado di aumento dell’angolo di inclinazione laterale"], "correct": "B"}, {"id": 19, "q": "L’allungamento alare è definito come:", "options": ["il rapporto tra la corda e l’apertura alare", "il rapporto tra l’apertura alare e la corda", "il rapporto fra il quadrato della superficie alare e l’apertura", "il rapporto tra la superficie alare e la portanza"], "correct": "B"}, {"id": 20, "q": "Come viene realizzato il movimento del velivolo nell’aria?", "options": ["con un surriscaldamento dell’aria circostante", "mediante l’accelerazione all’indietro di una massa d’aria, determinata dall’elica mossa dal motore", "mediante la spinta determinata dal vento direttamente sull’elica", "con una costante diminuzione del peso dovuto al consumo di carburante"], "correct": "B"}, {"id": 21, "q": "Il flusso d’aria sul dorso dell’ala in volo normale genera:", "options": ["una depressione", "una pressione", "importanti formazioni di vortici", "non ha influenza sulla pressione"], "correct": "A"}, {"id": 22, "q": "Il fattore di carico è:", "options": ["il rapporto fra il peso del velivolo e la superficie alare", "il rapporto tra la velocità del velivolo e l’accelerazione di gravità", "il rapporto tra peso apparente e peso reale del velivolo", ""], "correct": "C"}, {"id": 23, "q": "Lo stallo cui si riferiscono le relative velocità riportate sul manuale di volo sono in rapporto al velivolo sottoposto alla sola accelerazione di gravità di 1g. Come si definisce lo stallo che avviene ad accelerazioni superiori ad 1g, come in virata ed in richiamata?", "options": ["il nome non prende aggettivi", "stallo diverso", "stallo dinamico o accelerato, “G” stallo", "non viene considerato dal pilota esperto"], "correct": "C"}, {"id": 24, "q": "In virate vicine al suolo, soprattutto a bassa velocità, si corre il rischio di provocare un ingresso involontario in vite. Vero o falso?", "options": ["vero", "falso", "", ""], "correct": "A"}, {"id": 25, "q": "In campo aeronautico, la velocità verticale può essere espressa in:", "options": ["piedi al minuto (ft/min.); metri al secondo (m/s)", "miglia nautiche al minuto (NM/min); metri al secondo (m/s)", "piedi al minuto (ft); chilometri al secondo (Km/s)", "piedi all’ora (ft/h); metri all’ora (m/h)"], "correct": "A"}, {"id": 26, "q": "L’asse longitudinale di un velivolo viene anche chiamato:", "options": ["asse di rollio", "asse di beccheggio", "asse di imbardata", "asse di rotazione"], "correct": "A"}, {"id": 27, "q": "Il piano fisso orizzontale di coda (stabilizzatore) di un velivolo ha lo scopo di:", "options": ["assicurare la stabilità trasversale", "assicurare la stabilità longitudinale", "consentire il rullo a qualunque incidenza", "assicurare tutte e tre le precedenti funzioni"], "correct": "B"}, {"id": 28, "q": "L’aumento dell’allungamento alare ha l’effetto di:", "options": ["limitare l’ampiezza degli spostamenti del centro di pressione", "ridurre gli effetti della resistenza indotta", "diminuire l’efficienza massima dell’ala", "diminuire la resistenza di forma del profilo"], "correct": "B"}, {"id": 29, "q": "Un piede a quanti centimetri corrisponde?", "options": ["33cm", "36cm", "30,48cm", "25 cm"], "correct": "C"}, {"id": 30, "q": "La formula d’equilibrio delle forze in volo rettilineo livellato a velocità costante dice che:", "options": ["la portanza è più alta del peso e la trazione maggiore della resistenza", "la portanza è uguale al peso e la trazione è uguale alla resistenza", "la portanza è uguale al peso, e la trazione deve essere maggiore della resistenza", "non esiste alcuna relazione tra portanza, peso, trazione e resistenza"], "correct": "B"}, {"id": 31, "q": "Il flusso d’aria sul ventre dell’ala in volo normale genera:", "options": ["normalmente, una pressione maggiore rispetto al dorso", "importanti formazioni di vortici", "una depressione", "non ha influenza sulla pressione"], "correct": "A"}, {"id": 32, "q": "In volo rettilineo orizzontale uniforme il fattore di carico è pari a:", "options": ["0", "1", "2", "3"], "correct": "B"}, {"id": 33, "q": "Quale effetto ha un aumento del fattore di carico su un aeroplano durante un avvicinamento allo stallo?", "options": ["l’aeroplano stalla ad una velocità più alta", "l’aeroplano tende ad entrare in vite", "l’aeroplano è difficile da governare", "l’aeroplano manifesta una tendenza al rullo ed all’imbardata non appena entra in stallo"], "correct": "A"}, {"id": 34, "q": "In riattaccata la prima cosa da fare è rientrare i flaps da configurazione di atterraggio a configurazione di salita, tanto la velocità di stallo non cambia. Vero o falso?", "options": ["vero", "falso", "", ""], "correct": "B"}, {"id": 35, "q": "L’asse trasversale di un velivolo viene anche chiamato:", "options": ["asse di rollio", "asse di beccheggio", "asse di imbardata", "asse di rotazione"], "correct": "B"}, {"id": 36, "q": "La principale superficie aerodinamica di un velivolo, destinata ad assicurare la stabilità direzionale, è:", "options": ["la superficie alare", "il piano di coda orizzontale", "il timone di direzione (parte mobile)", "la deriva (stabilizzatore verticale)"], "correct": "D"}, {"id": 37, "q": "Tra le seguenti affermazioni relative al volo librato, una sola è esatta:", "options": ["per realizzare la massima distanza è preferibile che il peso del velivolo sia il più basso possibile", "la massima distanza in volo librato si realizza all’angolo di incidenza corrispondente alla massima efficienza", "per realizzare la massima distanza è necessario effettuare la discesa con l’angolo di pendenza massimo", "per realizzare, in presenza di vento contrario, la massima distanza in volo librato, è necessario avere una IAS inferiore a quella corrispondente alla massima efficienza"], "correct": "B"}, {"id": 38, "q": "Un miglio nautico a quanti metri corrisponde?", "options": ["1852m", "1500m", "1620m", "1609m"], "correct": "A"}, {"id": 39, "q": "Gli assi del velivolo sono:", "options": ["longitudinale e trasversale", "longitudinale, trasversale e verticale", "longitudinale, trasversale ed obliquo", "longitudinale, trasversale, antiorario"], "correct": "B"}, {"id": 40, "q": "La portanza prodotta da un profilo alare agisce:", "options": ["mediamente tra la corda e il vento relativo", "in senso contrario al vento relativo", "parallelamente al vento relativo", "perpendicolarmente al vento relativo"], "correct": "D"}, {"id": 41, "q": "Se con un aeromobile del peso di 2.000 Kg si raggiunge il fattore di carico 3, il carico complessivo cui sono sottoposte le strutture dell’aeroplano sono:", "options": ["2.000 Kg.", "4.000 Kg.", "6.000 Kg.", "9.000 Kg."], "correct": "C"}, {"id": 42, "q": "Lo stallo accelerato non si verifica purché si mantenga, nelle virate e richiamate accentuate, una velocità almeno pari a quella di stallo in VRO. Vero o falso?", "options": ["Vero", "Falso", "", ""], "correct": "B"}, {"id": 43, "q": "Cosa s’intende per volo lento?", "options": ["il volo con vento in coda", "il volo condotto a velocità al di sotto di quella di separazione dei regimi, in secondo regime", "il volo condotto alle velocità di massima efficienza", "il volo condotto alle velocità di massima autonomia chilometrica"], "correct": "B"}, {"id": 44, "q": "In campo aeronautico le quote si misurano in:", "options": ["piedi (ft) e chilometri", "piedi (ft) e metri (m)", "miglia nautiche (NM) e metri (m)", ""], "correct": "B"}, {"id": 45, "q": "L’asse verticale di un velivolo viene anche chiamato:", "options": ["asse di rollio", "asse di beccheggio", "asse di imbardata", "asse di rotazione"], "correct": "C"}, {"id": 46, "q": "Sezionando un’ala con un piano ideale parallelo alla direzione del moto e perpendicolare al piano trasversale dell’ala stessa, si determina una figura geometrica che prende il nome di:", "options": ["contorno", "profondità", "alettone", "profilo alare"], "correct": "D"}, {"id": 47, "q": "Lo stallo si può verificare:", "options": ["solo a bassa velocità, a qualsiasi valore dell’incidenza", "solo a bassa velocità con incidenza oltre l’angolo critico", "a qualsiasi velocità con incidenza oltre l’angolo critico", "a velocità elevata, con incidenza pari all’angolo di minima efficienza"], "correct": "C"}, {"id": 48, "q": "Quale unità di misura viene usata in aeronautica per la misura della pressione atmosferica?", "options": ["il millimetro di mercurio", "il grammo", "il milligrammo", "l’hectopascal ed il pollice di mercurio"], "correct": "D"}, {"id": 49, "q": "Il comando delle rotazioni attorno all’asse trasversale è assicurato da:", "options": ["alettoni", "timone di direzione (equilibratore verticale)", "motore", "timone di profondità (equilibratore orizzontale)"], "correct": "D"}, {"id": 50, "q": "La portanza dell’ala è il risultato:", "options": ["della pressione positiva agente sul dorso e sul ventre", "della pressione negativa agente sul ventre e di quella positiva agente sul dorso", "della minor pressione esistente sul dorso rispetto a quella sul ventre", "della pressione negativa agente sul dorso e sul ventre"], "correct": "C"}, {"id": 51, "q": "Durante la virata a quota costante il fattore di carico:", "options": ["aumenta con l'aumentare dell'inclinazione laterale", "diminuisce con l'aumentare dell'inclinazione laterale", "rimane costante a qualsiasi inclinazione laterale", "aumenta con la diminuzione dell'inclinazione laterale"], "correct": "A"}, {"id": 52, "q": "Prima dello stallo la curva del Cp indica che, superata una certa incidenza, si verifica una diminuzione di portanza. Ciò è vero anche per la resistenza?", "options": ["Sì", "tutt'altro: in tali condizioni la resistenza subisce un considerevole aumento", "dipende dalla densità dell'aria", "qualche volta diminuisce come la portanza"], "correct": "B"}, {"id": 53, "q": "Quale è l'effetto più vistoso del volo condotto in campo di secondo regime?", "options": ["che per mantenere il VRO a velocità più bassa occorre più potenza", "che per mantenere il VRO a velocità più alta occorre più potenza", "che per mantenere il VRO a velocità più bassa occorre meno potenza", "che non riesco mantenere il VRO con nessuna potenza disponibile"], "correct": "A"}, {"id": 54, "q": "In campo aeronautico, le unità di misura usate per le pressioni sono:", "options": ["Km/h; in/Hg; Kg/mq", "mb; in/Hg; lb/mq", "mb; in/Hg; Kg/cmq; PSI", "Lb/sqft; in/Hg; Kg/mq"], "correct": "C"}, {"id": 55, "q": "Per virare a sinistra, la posizione degli alettoni è la seguente:", "options": ["alettone destro alzato e alettone sinistro abbassato", "alettone sinistro alzato e alettone destro abbassato", "alettone sinistro e destro in posizione neutra", "alettone sinistro alzato; alettone destro in posizione neutra"], "correct": "B"}, {"id": 56, "q": "Il profilo alare rappresentato appartiene alla categoria:", "options": ["dei piano/convessi", "dei concavo/convessi", "dei biconvessi asimmetrici", "dei biconvessi simmetrici"], "correct": "B"}, {"id": 57, "q": "Il fenomeno aerodinamico della vite è caratterizzato da:", "options": ["ala interna alla rotazione completamente stallata; elevato rateo di discesa; bassa velocità indicata", "ala esterna alla rotazione completamente stallata; elevato rateo di discesa; alta velocità indicata", "ali entrambe stallate; basso rateo di discesa; alta velocità indicata", "ala interna alla rotazione completamente stallata; elevato rateo di discesa; alta velocità indicata"], "correct": "A"}, {"id": 58, "q": "Qual è il valore standard della pressione atmosferica a livello del mare?", "options": ["1013,25 hPa (hectopascal), 29,92 inches Hg (pollici)", "quella equivalente al peso di una colonna di mercurio di 900 millimetri", "non esiste: è continuamente variabile", "quella comunicata di volta in volta dagli Enti di controllo del traffico aereo"], "correct": "A"}, {"id": 59, "q": "Il comando delle rotazioni attorno all'asse longitudinale è assicurato da:", "options": ["timone di profondità", "timone di direzione", "motore", "alettoni"], "correct": "D"}, {"id": 60, "q": "Che cosa è il centro di pressione?", "options": ["è il luogo dei punti che hanno la stessa pressione atmosferica", "è il punto dove si scarica la pressione dell'olio di lubrificazione", "è il punto di applicazione della forza aerodinamica totale", "nessuna delle risposte è corretta"], "correct": "C"}, {"id": 61, "q": "Durante una virata a 60° si sviluppa un fattore di carico = 2. In tal caso la portanza dovrà essere:", "options": ["eguale al peso del velivolo", "di poco superiore al peso del velivolo", "il doppio del peso del velivolo", "inferiore al peso del velivolo"], "correct": "C"}, {"id": 62, "q": "Il peso del velivolo quale influenza ha sulla velocità di stallo?", "options": ["ne diminuisce il valore", "ne aumenta il valore", "non ha influenza", ""], "correct": "B"}, {"id": 63, "q": "La resistenza totale è data dalla somma di due tipi di resistenza:", "options": ["resistenza dell'elica e del carrello", "resistenza introdotta dal sistema frenante e dalla superficie di pista", "resistenza indotta e resistenza parassita", "resistenza indotta e resistenza totale"], "correct": "C"}, {"id": 64, "q": "Per virare a destra, la posizione degli alettoni è la seguente:", "options": ["alettone destro alzato e alettone sinistro abbassato", "alettone sinistro alzato e alettone destro abbassato", "alettone sinistro e destro in posizione neutra", "alettone destro alzato e alettone sinistro in posizione neutra"], "correct": "A"}, {"id": 65, "q": "La fuoriuscita degli ipersostentatori influisce sulla velocità di stallo di un aereo?", "options": ["sì, essa aumenta, in quanto aumenta l'angolo di incidenza", "sì, essa diminuisce, in quanto aumenta il Cp massimo", "sì, essa aumenta, in quanto aumenta la curvatura del profilo", "no, essa è indipendente dalla posizione degli ipersostentatori"], "correct": "B"}, {"id": 66, "q": "Verso quale punto terrestre si dirige l'ago della bussola magnetica?", "options": ["verso un punto vicino al piede della perpendicolare alla stella polare, chiamato Polo Nord magnetico", "il punto coincidente con il piede della perpendicolare alla stella polare", "verso la stella polare", "verso il Nord geografico"], "correct": "A"}, {"id": 67, "q": "Il comando delle rotazioni attorno all'asse verticale è assicurato da:", "options": ["timone di profondità (equilibratore orizzontale)", "motore", "timone di direzione (equilibratore verticale)", "alettoni"], "correct": "C"}, {"id": 68, "q": "Per sviluppare la stessa portanza all'aumentare della quota, un aeroplano deve volare:", "options": ["ad una velocità vera (TAS) più bassa a parità di angolo d'incidenza", "alla stessa velocità vera (TAS) indipendentemente dall'angolo d'incidenza", "ad una velocità vera (TAS) più bassa con un angolo d'inc  letter of the callsign.", "the last two letters of the callsign."], "correct": "B"}, {"id": 307, "q": "Which information need to be contained in a take-off report when it is transmitted via radio communication?", "options": ["Callsign, departure time, destination aerodrome", "Callsign, departure aerodrome, destination aerodrome", "Callsign, departure aerodrome, take-off time", "Callsign, departure aerodrome, departure time, destination aerodrome"], "correct": "D"}, {"id": 308, "q": "Direction changes in the traffic pattern, during approach and after take-off are normally conducted", "options": ["to the north.", "to the south.", "as left turns.", "as right turns."], "correct": "C"}, {"id": 309, "q": "When clouds are reported to be \"broken\" via radio, the amount of clouds covering the sky is", "options": ["No clouds below 5000 ft AGL.", "1 to 2 eighths.", "5 to 7 eighths.", "8 eighths below 10,000 ft."], "correct": "C"}, {"id": 310, "q": "The altimeter is set to the reference pressure 1013.2 hPa and indicates 7500 ft. The ground station requests the current aircraft altitude. What should be the pilot's answer?", "options": ["7500 ft AGL", "7500 ft", "7500 ft AMSL", "FL75"], "correct": "D"}, {"id": 311, "q": "What does an aircraft indicate to the ground station when it transmits A/S 7700?", "options": ["The aircraft is in distress.", "The aircraft has suffered a radio communications failure.", "The aircraft enters airspace E.", "The aircraft is being hijacked."], "correct": "A"}];const $=x=>document.getElementById(x);let subject='flight',session=null,translated=false,grid=false,mode='study';let saved=JSON.parse(localStorage.getItem('pq5sessions')||'{}'),wrong=JSON.parse(localStorage.getItem('pq5wrong')||'{}');const data=()=>subject==='flight'?FLIGHT:ENGLISH;const key=()=>subject;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function store(){saved[key()]=session;localStorage.setItem('pq5sessions',J store();render()});$('feedback').textContent=a&&session.mode==='study'?(a===q.correct?'✓ Risposta corretta':'✕ Risposta errata · corretta: '+q.correct):'';$('prev').disabled=session.index===0;$('next').textContent=session.index===session.ids.length-1?'Termina':'Successiva →';$('navigator').classList.toggle('hidden',!grid);tiles();if(translated&&subject==='english')translateCurrent(q)}function tiles(){$('tiles').innerHTML=session.ids.map((id,i)=>{const q=data().find(x=>x.id===id),a=session.answers[id];return '<button class="tile '+(a?(a===q.correct?'good':'bad'):'')+(i===session.index?' current':'')+'" data-index="'+i+'">'+id+'</button>'}).join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{session.index=Number(b.dataset.index);store();render()})}function move(d){if(session.index+d>=session.ids.length){finish();return}session.index=Math.max(0,session.index+d);store();render()}function finish(){session.finished=true;store();let right=session.ids.filter(id=>session.answers[id]===data().find(q=>q.id===id).correct).length;$('score').textContent=right+' / '+session.ids.length+' risposte corrette';show('result')}const cache=JSON.parse(localStorage.getItem('pq5translations')||'{}');async function translateText(t){if(!t)return '';if(cache[t])return cache[t];const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(t.slice(0,450))+'&langpair=en|it';const r=await fetch(url);if(!r.ok)throw Error('Servizio non disponibile');const j=await r.json();if(j.responseStatus!==200||!j.responseData?.translatedText)throw Error('Traduzione non disponibile');cache[t]=j.responseData.translatedText;try{localStorage.setItem('pq5translations',JSON.stringify(cache))}catch{}return cache[t]}let token=0;async function translateCurrent(q){const t=++token;$('translationStatus').textContent='Traduzione in corso…';try{const values=await Promise.all([q.q,...q.options].map(translateText));if(t!==token||qnow().id!==q.id||!translated)return;$('question').textContent=values[0];document.querySelectorAll('[data-answer]').forEach(b=>{let i='ABCD'.indexOf(b.dataset.answer);b.innerHTML='<b>'+b.dataset.answer+'.</b> '+esc(values[i+1])});$('translationStatus').textContent='Traduzione automatica: verifica sempre i termini aeronautici.'}catch(e){if(t!==token)return;$('translationStatus').textContent='Traduzione non disponibile. Serve Internet e il servizio potrebbe avere limiti.'}}$('flight').onclick=()=>choose('flight');$('english').onclick=()=>choose('english');$('back').onclick=()=>show('home');$('start').onclick=start;$('resume').onclick=()=>{session=saved[key()];render()};$('gridBtn').onclick=()=>{grid=!grid;$('navigator').classList.toggle('hidden',!grid);tiles()};$('lang').onclick=()=>{translated=!translated;token++;$('translationStatus').textContent='';render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('exit').onclick=()=>$('modal').classList.remove('hidden');$('cancel').onclick=()=>$('modal').classList.add('hidden');$('confirm').onclick=()=>{$('modal').classList.add('hidden');store();choose(subject)};$('again').onclick=()=>choose(subject);</script></body></html>
